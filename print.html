                    </style>
                    <body>
                        <table  style="margin-top:10px;">
                            <thead><tr><th>العمود الأول</th><th>العمود الثاني</th><th>العمود الثالث</th></tr></thead>
                            <tbody>
                                <tr><td>بيانات الصف الأول</td><td>بيانات الصف الأول</td><td>بيانات الصف الأول</td></tr>
                                <tr><td>بيانات الصف الثاني</td><td>بيانات الصف الثاني</td><td>بيانات الصف الثاني</td></tr>

                            </tbody>
                        </table>
                    </body>
                    </html>
`;
            try {


                fetch('http://localhost:5000/generate-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ htmlContent: data }),
                })
                    .then(response => response.blob())  // Get the response as a Blob (binary data)
                    .then(blob => {
                        const url = window.URL.createObjectURL(blob);  // Create a URL for the Blob
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'generated.pdf';  // Set the file name for download
                        document.body.appendChild(a);  // Append link to the document
                        a.click();  // Simulate a click to download the file
                        document.body.removeChild(a);  // Clean up the link element
                    })
                    .catch(error => console.error('Error generating PDF:', error));

        function escapeString(jsonString) {
            return jsonString.replace(/[\b\f\n\r\t\\'"]/g, function (char) {
                switch (char) {
                    case '\b': return '\\b';
                    case '\f': return '\\f';
                    case '\n': return '\\n';
                    case '\r': return '\\r';
                    case '\t': return '\\t';
                    case '\\': return '\\\\';
                    case '\'': return '\\\'';
                    case '\"': return '\\\"';
                    default: return char;
                }
            });
        }
